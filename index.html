<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e7490">
<title>Peace Kids Bingo</title>
<style>
  /* ---- Content settings live in the <script> CONFIG/PROMPTS below. Style only here. ---- */
  :root{
    --sand:#f7ecd2; --sand-deep:#efdcb4; --ink:#1c2733; --muted:#5a6b7a;
    --sea:#0e7490; --sea-deep:#0b5566; --line:#d8c69e;
    --rainbow:linear-gradient(90deg,#e11d48,#f97316,#facc15,#22c55e,#0ea5e9,#8b5cf6);
    --rainbow-diag:linear-gradient(135deg,#e11d48,#f97316,#facc15,#22c55e,#0ea5e9,#8b5cf6);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--sand);color:var(--ink);
    font:15px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:env(safe-area-inset-top) 6px calc(env(safe-area-inset-bottom) + 6px);
    overflow:hidden;
  }

  /* ---- Header ---- */
  header{width:100%;max-width:560px;text-align:center;padding:6px 4px 4px;}
  h1{
    font-size:clamp(20px,6vw,30px);font-weight:900;letter-spacing:.01em;line-height:1;
    background:var(--rainbow);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sub{font-size:12px;color:var(--muted);margin-top:2px;font-weight:600;}
  .who{
    display:flex;align-items:center;justify-content:center;gap:8px;margin-top:5px;
    font-size:13px;color:var(--muted);
  }
  .who b{color:var(--ink);font-weight:800;}
  .who button{
    background:none;border:0;color:var(--muted);font-size:11px;text-decoration:underline;
    cursor:pointer;padding:2px 4px;opacity:.65;
  }

  /* ---- Status line: BINGO + blackout ---- */
  .status{
    width:100%;max-width:560px;display:flex;gap:8px;align-items:stretch;margin:6px 0 4px;
  }
  .chip{
    flex:1;border-radius:10px;padding:7px 6px;text-align:center;font-weight:800;
    background:#fff;border:1.5px solid var(--line);color:var(--muted);font-size:12px;line-height:1.15;
  }
  .chip .big{display:block;font-size:16px;color:var(--ink);}
  .chip.hit{background:var(--rainbow);color:#fff;border-color:transparent;}
  .chip.hit .big{color:#fff;}

  /* ---- Board ---- */
  .board{
    width:min(97vw, calc(100dvh - 176px));max-width:600px;aspect-ratio:1;
    display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);
    gap:5px;padding:5px;background:var(--sand-deep);border-radius:14px;
    box-shadow:0 2px 0 var(--line), 0 10px 24px rgba(20,40,60,.12);
  }
  .cell{
    position:relative;border:0;border-radius:9px;background:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;padding:3px 3px;overflow:hidden;cursor:pointer;
    box-shadow:inset 0 0 0 1.5px var(--line);
    font:inherit;color:var(--ink);text-align:center;
    transition:transform .06s ease;
  }
  .cell:active{transform:scale(.94);}
  .cell .emoji{font-size:clamp(17px,5vw,30px);line-height:1;}
  .cell img{width:clamp(22px,6.4vw,38px);height:clamp(22px,6.4vw,38px);object-fit:contain;}
  .cell .txt{
    font-size:clamp(9px,2.8vw,14px);font-weight:700;line-height:1.1;
    overflow-wrap:anywhere;hyphens:auto;max-height:4.2em;overflow:hidden;
  }
  .cell.marked{color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.4);}
  .cell.marked::before{
    content:"";position:absolute;inset:0;background:var(--rainbow-diag);opacity:.92;z-index:0;
  }
  .cell.marked .emoji,.cell.marked .txt,.cell.marked img{position:relative;z-index:1;}
  .cell.marked img{filter:drop-shadow(0 1px 1px rgba(0,0,0,.35));}
  .cell .stamp{
    position:absolute;z-index:2;top:2px;right:3px;font-size:clamp(12px,3.6vw,18px);
    color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);opacity:0;transform:scale(.4);
    transition:opacity .12s ease,transform .12s ease;
  }
  .cell.marked .stamp{opacity:1;transform:scale(1);}

  /* center free space */
  .cell.free::after{
    content:"FREE";position:absolute;bottom:2px;left:0;right:0;z-index:2;
    font-size:8px;font-weight:800;letter-spacing:.12em;color:rgba(255,255,255,.85);
  }

  footer{width:100%;max-width:560px;text-align:center;color:var(--muted);font-size:11px;margin-top:6px;}

  /* ---- Name modal ---- */
  .modal{
    position:fixed;inset:0;background:rgba(16,30,42,.55);backdrop-filter:blur(2px);
    display:none;align-items:center;justify-content:center;padding:20px;z-index:20;
  }
  .modal.show{display:flex;}
  .card{
    background:#fff;border-radius:16px;padding:22px 20px;max-width:340px;width:100%;
    text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3);
  }
  .card h2{font-size:20px;font-weight:900;margin-bottom:4px;}
  .card h2 span{background:var(--rainbow);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .card p{font-size:13px;color:var(--muted);margin-bottom:14px;}
  .card input{
    width:100%;font-size:17px;padding:12px 14px;border:2px solid var(--line);border-radius:11px;
    text-align:center;margin-bottom:12px;outline:none;
  }
  .card input:focus{border-color:var(--sea);}
  .card button{
    width:100%;font-size:16px;font-weight:800;color:#fff;border:0;border-radius:11px;
    padding:13px;cursor:pointer;background:var(--rainbow);background-size:200% 100%;
  }

  /* ---- Win banner ---- */
  .banner{
    position:fixed;left:50%;top:16px;transform:translateX(-50%) translateY(-160%);
    background:var(--rainbow);color:#fff;font-weight:900;font-size:17px;letter-spacing:.02em;
    padding:11px 22px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:30;
    transition:transform .4s cubic-bezier(.2,1.4,.4,1);white-space:nowrap;
  }
  .banner.show{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<header>
  <h1>✌️ Peace Kids Bingo</h1>
  <div class="who">Playing as <b id="whoName">--</b><button id="changeUser">change player</button></div>
</header>

<div class="status">
  <div class="chip" id="bingoChip"><span class="big" id="bingoCount">0</span>bingos</div>
  <div class="chip" id="blackoutChip"><span class="big" id="blackoutCount">0/25</span>to blackout</div>
</div>

<main>
  <div class="board" id="board" aria-label="bingo board"></div>
</main>


<div class="modal" id="modal">
  <div class="card">
    <h2>✌️ Welcome, <span>Peace Kid</span></h2>
    <p>Enter your name to get your board.</p>
    <input id="nameInput" type="text" autocomplete="off" autocapitalize="words"
           placeholder="Your name" enterkeyhint="go" />
    <button id="startBtn">Get my board</button>
  </div>
</div>

<div class="banner" id="banner">✌️ BINGO! ✌️</div>

<script>
/* ============================================================================
   CONTENT SETTINGS -- edit these two blocks to change the game.
   Each prompt is { id, text } plus optional emoji or img.
   `img` is a file placed in images/ (e.g. { id:"shotgun", text:"Shotgun", img:"shotgun.jpg" }).
   The pool can be any size >= 24; each player gets a random 24-square subset.

   `id` is a permanent key, NOT a description. It drives which square a player
   gets and which square a mark belongs to. Rules:
     - Give every new prompt a unique id no other prompt has ever used.
     - Never change or reuse an id, even if you rewrite the prompt's text.
   Follow those and you can freely rename text or add prompts without moving
   anyone's existing squares or losing their marks.
   ========================================================================== */
const CONFIG = {
  // Center free space.
  freeSpace: { id: "free", text: "Shotgun", img: "shotgun.jpg" },
};

const PROMPTS = [
  { id: "dianne",      text: "Find Dianne",               emoji: "👩" },
  { id: "where-she",   text: "<i>Where Is She?</i>",      emoji: "🦇" },
  { id: "celly",       text: "Celly for the Camera",      emoji: "📸" },
  { id: "squatgun",    text: "Squatgun",                  emoji: "🏋️" },
  { id: "spank-train", text: "Spank Train",               emoji: "🍑" },
  { id: "bolero",      text: "Bolero",                    emoji: "💃" },
  { id: "beer-garden", text: "Beer Garden Cheers",        emoji: "🍻" },
  { id: "find-friend", text: "Find a Friend",             emoji: "🫂" },
  { id: "dunk-head",   text: "Dunk Ya Head in the Ocean", emoji: "🌊" },
  { id: "sexoteque",   text: "Sexoteque",                 emoji: "🕺" },
  { id: "sunscreen",   text: "Sunscreen a Friend",        emoji: "🧴" },
  { id: "glitter",     text: "Glitter / Temp Tattoos",    emoji: "✨" },
  { id: "only-dump",   text: "ONLY DUMP",                 emoji: "💩" },
  { id: "propose",     text: "Propose to Mel or Benson",  emoji: "💍" },
  { id: "hit-sand",    text: "Hit the Sand",              emoji: "🏖️" },
  { id: "trophy",      text: "Drink from a Trophy",       emoji: "🏆" },
  { id: "two-pointer", text: "2 Pointer",                 emoji: "✌️" },
  { id: "hp-twerk",    text: "Harry Potter Twerk",        emoji: "🧹" },
  { id: "upside-down", text: "Upside Down Only",          emoji: "🔨" },
  { id: "knees",       text: "Score from Your Knees",     emoji: "🧎" },
  { id: "layout",      text: "Gratuitous Layout",         emoji: "🤸" },
  { id: "speech",      text: "SPEECH",                    emoji: "🎤" },
  { id: "call-home",   text: "Call Kids / Mom / Wife",    emoji: "📞" },
  { id: "celeb-point", text: "Celebrity Point",           emoji: "🌟" },
];

/* ============================================================================
   ENGINE -- deterministic board from a name. No server, all local.
   ========================================================================== */
const STORE_USER = "bingo:user";
const marksKey = (name) => "bingo:marks2:" + name; // stores an array of marked prompt ids
const FREE_INDEX = 12; // center of a 5x5

// Canonicalize a name so the same person always resolves to the same seed,
// across devices and keyboards. Freeze these rules: changing them rebuilds boards.
function normName(raw) {
  return raw.trim().replace(/\s+/g, " ").toLowerCase().normalize("NFC");
}

// cyrb128: string -> four 32-bit seed words.
function cyrb128(str) {
  let h1 = 1779033703, h2 = 3144134277, h3 = 1013904242, h4 = 2773480762;
  for (let i = 0, k; i < str.length; i++) {
    k = str.charCodeAt(i);
    h1 = h2 ^ Math.imul(h1 ^ k, 597399067);
    h2 = h3 ^ Math.imul(h2 ^ k, 2869860233);
    h3 = h4 ^ Math.imul(h3 ^ k, 951274213);
    h4 = h1 ^ Math.imul(h4 ^ k, 2716044179);
  }
  h1 = Math.imul(h3 ^ (h1 >>> 18), 597399067);
  h2 = Math.imul(h4 ^ (h2 >>> 22), 2869860233);
  h3 = Math.imul(h1 ^ (h3 >>> 17), 951274213);
  h4 = Math.imul(h2 ^ (h4 >>> 19), 2716044179);
  h1 ^= h2 ^ h3 ^ h4; h2 ^= h1; h3 ^= h1; h4 ^= h1;
  return [h1 >>> 0, h2 >>> 0, h3 >>> 0, h4 >>> 0];
}

// Per-(name, id) sort key. Depends only on the name and the prompt's id, so
// renaming a prompt or adding new ones leaves every other prompt's key -- and
// therefore its board slot -- untouched.
function rankKey(name, id) {
  return cyrb128(name + "|" + id)[0];
}

// Build the 25-cell board (center = free space) deterministically from a name.
// The 24 lowest-ranked prompts fill the grid in rank order; ties break on id.
function boardFor(name) {
  const cells = PROMPTS
    .map((p) => ({ p, k: rankKey(name, p.id) }))
    .sort((a, b) => a.k - b.k || (a.p.id < b.p.id ? -1 : 1))
    .slice(0, 24)
    .map((r) => r.p);
  cells.splice(FREE_INDEX, 0, { ...CONFIG.freeSpace, free: true });
  return cells;
}

// The 12 winning lines (row/col/diagonal) as index arrays.
const LINES = (() => {
  const lines = [];
  for (let r = 0; r < 5; r++) lines.push([0, 1, 2, 3, 4].map((c) => r * 5 + c));
  for (let c = 0; c < 5; c++) lines.push([0, 1, 2, 3, 4].map((r) => r * 5 + c));
  lines.push([0, 6, 12, 18, 24]);
  lines.push([4, 8, 12, 16, 20]);
  return lines;
})();

/* ---- State + rendering ---- */
let currentName = "";      // normalized
let displayName = "";      // what the user typed
let cells = [];            // current board, 25 prompt objects
let markedIds = new Set(); // ids the player has marked, source of truth for marks
let marks = new Array(25).fill(false); // per-cell view of markedIds, for the win logic

// Marks are keyed by prompt id, so a mark stays with its prompt no matter where
// the prompt lands on the board or whether the prompt pool changes.
function loadMarkedIds(name) {
  try {
    const arr = JSON.parse(localStorage.getItem(marksKey(name)));
    if (Array.isArray(arr)) return new Set(arr.filter((x) => typeof x === "string"));
  } catch (e) {}
  return new Set();
}
function saveMarks() {
  try { localStorage.setItem(marksKey(currentName), JSON.stringify([...markedIds])); } catch (e) {}
}

function cellInner(cell) {
  const media = cell.img
    ? `<img src="images/${cell.img}" alt="">`
    : `<span class="emoji">${cell.emoji || ""}</span>`;
  return `${media}<span class="txt">${cell.text}</span><span class="stamp">✓</span>`;
}

function render() {
  const board = document.getElementById("board");
  cells = boardFor(currentName);
  marks = cells.map((c) => markedIds.has(c.id));
  board.innerHTML = "";
  cells.forEach((cell, i) => {
    const el = document.createElement("button");
    el.className = "cell" + (cell.free ? " free" : "") + (marks[i] ? " marked" : "");
    el.innerHTML = cellInner(cell);
    el.addEventListener("click", () => toggle(i, el));
    board.appendChild(el);
  });
  document.getElementById("whoName").textContent = displayName;
  updateStatus(false);
}

let prevBingos = 0;
function updateStatus(announce) {
  const bingos = LINES.filter((ln) => ln.every((i) => marks[i])).length;
  const filled = marks.filter(Boolean).length;

  const bChip = document.getElementById("bingoChip");
  document.getElementById("bingoCount").textContent = bingos;
  bChip.classList.toggle("hit", bingos > 0);

  const oChip = document.getElementById("blackoutChip");
  document.getElementById("blackoutCount").textContent = filled + "/25";
  const blackout = filled === 25;
  oChip.classList.toggle("hit", blackout);

  if (announce && bingos > prevBingos) {
    showBanner(blackout ? "✌️ BLACKOUT! ✌️" : "✌️ BINGO! ✌️");
  } else if (announce && blackout && filled === 25) {
    showBanner("✌️ BLACKOUT! ✌️");
  }
  prevBingos = bingos;
}

let bannerTimer;
function showBanner(text) {
  const b = document.getElementById("banner");
  b.textContent = text;
  b.classList.add("show");
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => b.classList.remove("show"), 2600);
}

function toggle(i, el) {
  const id = cells[i].id;
  if (markedIds.has(id)) markedIds.delete(id); else markedIds.add(id);
  marks[i] = markedIds.has(id);
  el.classList.toggle("marked", marks[i]);
  saveMarks();
  updateStatus(true);
}

/* ---- Name flow ---- */
function setUser(rawName) {
  displayName = rawName.trim().replace(/\s+/g, " ");
  currentName = normName(rawName);
  localStorage.setItem(STORE_USER, displayName);
  markedIds = loadMarkedIds(currentName);
  render();
  prevBingos = LINES.filter((ln) => ln.every((idx) => marks[idx])).length;
}

function openModal() {
  const m = document.getElementById("modal");
  const input = document.getElementById("nameInput");
  input.value = displayName || "";
  m.classList.add("show");
  setTimeout(() => input.focus(), 50);
}
function closeModal() { document.getElementById("modal").classList.remove("show"); }

function submitName() {
  const val = document.getElementById("nameInput").value;
  if (!val.trim()) return;
  setUser(val);
  closeModal();
}

document.getElementById("startBtn").addEventListener("click", submitName);
document.getElementById("nameInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") submitName();
});
document.getElementById("changeUser").addEventListener("click", openModal);

/* ---- Boot ---- */
(function init() {
  const saved = localStorage.getItem(STORE_USER);
  if (saved && saved.trim()) {
    setUser(saved);
  } else {
    document.getElementById("whoName").textContent = "--";
    openModal();
  }
})();
</script>
</body>
</html>
